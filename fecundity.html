<title>Cosmic Fecundity</title>
<style>
  html, body { margin: 0; height: 100%; background: #030306; overflow: hidden; }
  canvas { display: block; width: 100vw; height: 100vh; }
  .caption {
    position: fixed; left: 0; right: 0; bottom: 20px;
    text-align: center; pointer-events: none;
    font: 400 11px/1.6 ui-monospace, SFMono-Regular, Menlo, monospace;
    letter-spacing: 0.22em; text-transform: uppercase;
    color: rgba(206, 198, 232, 0.4);
  }
</style>

<canvas id="c"></canvas>
<div class="caption">every black hole is a universe</div>

<script>
(function () {
  'use strict';

  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d', { alpha: false });
  let W = 0, H = 0, DPR = 1, HALFDIAG = 0;

  const TAU = Math.PI * 2;
  const rand = (a, b) => a + Math.random() * (b - a);
  const pick = (a) => a[(Math.random() * a.length) | 0];
  const ease = (t) => (t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2);

  // ---------------------------------------------------------------- sprites
  // Every luminous thing on screen is one of a handful of cached radial
  // gradients, stamped additively. Overlapping copies sum into something that
  // reads as plasma, and it costs a blit instead of a path fill.
  const sprites = new Map();
  function glow(color, px = 64, core = 0, falloff = 2.6) {
    const key = color + '|' + px + '|' + core + '|' + falloff;
    let s = sprites.get(key);
    if (s) return s;
    s = document.createElement('canvas');
    s.width = s.height = px;
    const g = s.getContext('2d');
    const r = px / 2;
    const grad = g.createRadialGradient(r, r, 0, r, r, r);
    for (let i = 0; i <= 12; i++) {
      const t = i / 12;
      const a = t <= core ? 1 : Math.pow(1 - (t - core) / (1 - core), falloff);
      grad.addColorStop(t, 'rgba(' + color + ',' + a.toFixed(3) + ')');
    }
    g.fillStyle = grad;
    g.fillRect(0, 0, px, px);
    sprites.set(key, s);
    return s;
  }

  /** A sprite laid down rotated and non-uniformly stretched: streaks and arcs. */
  function blitR(sp, x, y, len, thick, cs, sn) {
    ctx.setTransform(DPR * cs, DPR * sn, -DPR * sn, DPR * cs, DPR * x, DPR * y);
    ctx.drawImage(sp, -len / 2, -thick / 2, len, thick);
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  }

  /** A sprite as an ellipse at an arbitrary position angle. */
  function blitE(sp, x, y, rx, ry, cs, sn) {
    ctx.setTransform(DPR * cs, DPR * sn, -DPR * sn, DPR * cs, DPR * x, DPR * y);
    ctx.drawImage(sp, -rx, -ry, rx * 2, ry * 2);
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  }

  /**
   * Square texture, rotated to a position angle and optionally mirrored.
   *
   * Falling into a black hole, the disc texture ends up many screens across,
   * and the cost of a blit is its area on the destination, not its source. So
   * once it is large, the four corners of the screen are pushed back through
   * the transform to find which part of the texture can actually be seen, and
   * only that part is drawn.
   */
  function blitT(tex, x, y, ext, cs, sn, flip) {
    let sx = 0, sy = 0, sw = TEX, sh = TEX, dx = -ext / 2, dy = -ext / 2, dw = ext, dh = ext;
    if (ext > HALFDIAG * 1.5) {
      let lx0 = Infinity, ly0 = Infinity, lx1 = -Infinity, ly1 = -Infinity;
      for (let i = 0; i < 4; i++) {
        const px = (i & 1 ? W : 0) - x, py = (i & 2 ? H : 0) - y;
        const u = (px * cs + py * sn) * flip;
        const v = -px * sn + py * cs;
        if (u < lx0) lx0 = u;
        if (u > lx1) lx1 = u;
        if (v < ly0) ly0 = v;
        if (v > ly1) ly1 = v;
      }
      const t0x = Math.max(0, Math.floor((lx0 / ext + 0.5) * TEX));
      const t1x = Math.min(TEX, Math.ceil((lx1 / ext + 0.5) * TEX));
      const t0y = Math.max(0, Math.floor((ly0 / ext + 0.5) * TEX));
      const t1y = Math.min(TEX, Math.ceil((ly1 / ext + 0.5) * TEX));
      if (t1x <= t0x || t1y <= t0y) return;
      sx = t0x; sy = t0y; sw = t1x - t0x; sh = t1y - t0y;
      dx = (t0x / TEX - 0.5) * ext;
      dy = (t0y / TEX - 0.5) * ext;
      dw = (sw / TEX) * ext;
      dh = (sh / TEX) * ext;
    }
    ctx.setTransform(DPR * cs * flip, DPR * sn * flip, -DPR * sn, DPR * cs, DPR * x, DPR * y);
    ctx.drawImage(tex, sx, sy, sw, sh, dx, dy, dw, dh);
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  }

  // Colours a telescope would actually record. Old metal-rich stars in the
  // bulge are warm; the arms are lit by short-lived O and B stars and run
  // blue-white; the pink knots are HII regions glowing in hydrogen alpha.
  const BULGE = ['255,214,158', '255,198,136', '250,224,186', '255,206,150'];
  const ARM = ['176,206,255', '208,226,255', '146,186,252', '196,216,255'];
  const HII = ['255,118,138', '255,146,150', '255,96,124'];
  const FIELD = ['238,232,220', '224,222,238', '250,238,212'];
  const STARLIGHT = ['255,240,215', '208,224,255', '255,204,158'];
  const PLANET = ['186,196,220', '214,172,138', '150,202,190', '204,164,186', '170,178,206'];
  const DUST = '4,3,6';

  // Set while the camera is punching through a horizon: everything luminous
  // stretches along the line of travel.
  let warp = 0;
  // True once the horizon being entered covers the whole screen. Everything the
  // universe outside it is made of is behind an opaque disc at that point, so
  // none of it needs drawing — but the disc itself very much does.
  let occlude = false;
  // Blackness held over the backdrop straight after a swap, so the frame after
  // passing through starts identical to the frame before it and the surrounding
  // space fades up instead of snapping on. This is the whole of the arrival —
  // there is no flash. The swap is already exact, so anything drawn to mark it
  // would only be drawing attention to a non-event.
  let veil = 0;

  const HOLE_R = 0.034;   // event-horizon radius, as a fraction of the disc
  const CORE_R = 2.6;     // the nucleus, in units of a stellar horizon
  // How much of the horizon the child universe fills. This one number decides
  // whether the transition can work at all. The horizon clears the screen at
  // roughly 1074px; natural framing for a universe is 299px. Set this near 1
  // and those two moments are 4x apart — which is exactly the overshoot that
  // forced a reverse zoom. At 0.28 they are the same moment, so the camera can
  // plunge straight through without ever slowing down or backing up.
  const CHILD_FILL = 0.28;
  const MAX_LEVEL = 3;     // nesting kept live below the current root

  // ------------------------------------------------- what a black hole is
  // Around a black hole, light does not travel in straight lines, and drawing
  // the result stamp by stamp every frame either beads up or costs the whole
  // budget. But the shape only depends on the inclination of the disc, which
  // never changes for a given hole — so it is worth rendering once, in fine
  // detail, into a texture, and thereafter blitting.
  //
  // Three things are baked in, and together they are the difference between a
  // black hole and a ring:
  //
  //   near half   the side of the disc between us and the hole, foreshortened
  //               by the inclination and passing IN FRONT of the shadow
  //   far half    bent up and over the top by the hole's own gravity, so
  //               instead of vanishing behind the shadow it arcs above it
  //   secondary   the underside of the far disc, wrapped the other way round
  //               and squeezed into a thin bright crescent below the shadow
  //
  // Face-on those three collapse back into a single circle, which is right.
  // Edge-on they open out into the shape everyone recognises.
  //
  // On top of that: the disc is far hotter and brighter inside than out, and
  // the side rotating toward us is beamed by roughly the cube of its Doppler
  // factor, which makes one half several times brighter than the other. That
  // asymmetry is the strongest single cue that this is a physical object.
  const QCI = [0.06, 0.22, 0.38, 0.54, 0.70, 0.86];  // quantised inclinations
  const TEX = 1024;       // texture resolution
  const TEXE = 4.9;       // half-extent of the texture, in shadow radii
  const RIN = 1.32, ROUT = 4.55;
  const texCache = new Map();

  // Blue-white at the inner edge where the gas is hottest, out through white
  // and amber to a dull red at the rim.
  const RAMP = [
    [0.00, 220, 238, 255],
    [0.16, 255, 250, 236],
    [0.40, 255, 226, 172],
    [0.66, 255, 168, 92],
    [1.00, 208, 86, 44],
  ];
  function ramp(t) {
    let i = 1;
    while (i < RAMP.length - 1 && t > RAMP[i][0]) i++;
    const a = RAMP[i - 1], b = RAMP[i];
    const u = (t - a[0]) / (b[0] - a[0]);
    return ((a[1] + (b[1] - a[1]) * u) | 0) + ',' +
           ((a[2] + (b[2] - a[2]) * u) | 0) + ',' +
           ((a[3] + (b[3] - a[3]) * u) | 0);
  }

  function discTex(qi, pass) {
    const key = qi + ':' + pass;
    let c = texCache.get(key);
    if (c) return c;
    const ci = QCI[qi];
    const sn = Math.sqrt(1 - ci * ci);
    c = document.createElement('canvas');
    c.width = c.height = TEX;
    const g = c.getContext('2d');
    const k = TEX / (2 * TEXE);
    g.translate(TEX / 2, TEX / 2);
    g.scale(k, k);           // from here on, one unit is one shadow radius
    g.globalCompositeOperation = 'lighter';
    // Butt caps, and only a whisker of overlap where the two halves of the
    // disc meet. Round caps stack up at the ends of all 260 rings and lay a
    // hairline straight across the middle of the hole; a generous overlap
    // instead piles both halves into a bright wedge there. The halves meet at
    // a kink because the far one is lensed and the near one is not, and that
    // kink is real — it is the ansa of the disc.
    g.lineCap = 'butt';

    // Beaming, as a gradient across the ring rather than as a chain of
    // segments. On a ring of radius rho the line-of-sight velocity goes as
    // cos(azimuth), and cos(azimuth) is exactly x/rho — so a single horizontal
    // gradient encodes the Doppler boost precisely, and the ring can be stroked
    // in one piece with no seams anywhere along it.
    // `tap` fades the very ends of the ring out. The near half of the disc and
    // the lensed far half both stop dead at the major axis, and two stacks of
    // 260 stroke ends landing on the same spot lays a bright hairline across
    // the hole. Fading the last one per cent of each ring hides both stacks; it
    // is far too narrow to touch the beaming, which peaks at those same ends.
    const US = [-1, -0.993, -0.975, -0.9, -0.75, -0.5, -0.25,
      0, 0.25, 0.5, 0.75, 0.9, 0.975, 0.993, 1];
    const beamed = (rx, col, peak, tap) => {
      const grd = g.createLinearGradient(-rx, 0, rx, 0);
      for (let i = 0; i < US.length; i++) {
        const u = US[i];
        const d = 1 + 0.42 * sn * u;
        // Half, so that the two halves meeting there sum back to one.
        const f = tap === false ? 1 : 0.5 + 0.5 * Math.min(1, (1 - Math.abs(u)) / 0.025);
        const a = peak * d * d * d * f;
        grd.addColorStop((u + 1) / 2, 'rgba(' + col + ',' + Math.min(1, a).toFixed(4) + ')');
      }
      return grd;
    };

    // Bloom, in the plane of the disc. Light this bright spills in any real
    // optic; without it the disc looks pasted on.
    if (pass === 0) {
      g.save();
      g.scale(1, 0.3 + 0.7 * ci);
      const bg = g.createRadialGradient(0, 0, 0, 0, 0, TEXE);
      bg.addColorStop(0, 'rgba(255,204,148,0.08)');
      bg.addColorStop(0.16, 'rgba(255,156,84,0.03)');
      bg.addColorStop(0.5, 'rgba(255,110,50,0)');
      g.fillStyle = bg;
      g.fillRect(-TEXE, -TEXE, TEXE * 2, TEXE * 2);
      g.restore();
    }

    // Many thin rings, each much wider than the step between them. Strokes have
    // hard edges, so a stack of them only looks like a smooth surface if any one
    // of them contributes a small fraction of the total; at low overlap the
    // plateaus show up as concentric ribbing.
    const NR = 260, OVER = 7, LAP = 0;
    const rhoAt = (t) => RIN + (ROUT - RIN) * Math.pow(t, 1.35);
    for (let i = 0; i < NR; i++) {
      const t = (i + 0.5) / NR;
      const rho = rhoAt(t);
      const gap = Math.max(0.004, rhoAt((i + 1.5) / NR) - rho);
      const col = ramp(t);
      // Flux falls off steeply outward, so nearly all the light comes from the
      // last little way in. A disc of even brightness reads as a painted ring.
      const flux = Math.pow(RIN / rho, 2.7);
      // A real disc flares: thicker and softer further out. Widening the stroke
      // without thinning it would just pile up more light, so the two cancel.
      const flare = 1 + t * 1.0;
      // Discs do not stop at a wall. Without a taper the outer edge cuts off
      // dead straight, which edge-on turns the whole disc into a drawn blade.
      const edge = Math.min(1, (1 - t) / 0.2);
      const lw = Math.max(0.02, gap * OVER * flare);
      const peak = (flux / flare) * edge * edge * (0.17 * 2.4 / OVER) * (pass === 0 ? 1.25 : 1);

      if (pass === 1) {
        // Near half: foreshortened by the inclination, passing in front.
        g.strokeStyle = beamed(rho, col, peak);
        g.lineWidth = lw;
        g.beginPath();
        g.ellipse(0, 0, rho, Math.max(rho * ci, rho * 0.05), 0, -LAP, Math.PI + LAP);
        g.stroke();
        continue;
      }

      // Far half, bent up and over the top. The floor keeps the lensed image
      // clear of the shadow: light passing inside the photon sphere never
      // reaches us at all.
      g.strokeStyle = beamed(rho, col, peak);
      g.lineWidth = lw;
      g.beginPath();
      g.ellipse(0, 0, rho, Math.max(rho * (0.52 + 0.48 * ci), 1.12), 0, Math.PI - LAP, TAU + LAP);
      g.stroke();

      // The secondary image: the underside of the far disc, wrapped the other
      // way round and squeezed into a crescent below the shadow. Traced across
      // the lower half; the beaming is unchanged, because it goes as the cosine
      // of the azimuth and cosine does not care which way the arc was drawn.
      // It is an edge-on effect: seen from above there is nothing to wrap
      // round, and the second image merges into the photon ring.
      if (t < 0.6 && sn > 0.2) {
        const r2 = 1.16 + (rho - RIN) * 0.22;
        g.strokeStyle = beamed(r2, col, peak * 0.55 * sn);
        g.lineWidth = lw * 0.6;
        g.beginPath();
        g.ellipse(0, 0, r2, Math.max(r2 * 0.32, 1.09), 0, -LAP, Math.PI + LAP);
        g.stroke();
      }
    }

    // Striations. Accretion discs are turbulent sheets, not enamel — but the
    // unevenness has to be irregular, because anything periodic reads as banding.
    let seed = 1234 + qi * 77 + pass * 13;
    const rnd = () => { seed = (seed * 1103515245 + 12345) & 0x7fffffff; return seed / 0x7fffffff; };
    for (let i = 0; i < 260; i++) {
      const t = Math.pow(rnd(), 1.6);
      const rho = rhoAt(t);
      const col = ramp(t);
      const f0 = (pass === 1 ? 0 : Math.PI) + rnd() * (Math.PI * 0.8);
      const ry = pass === 1 ? Math.max(rho * ci, rho * 0.05)
                            : Math.max(rho * (0.52 + 0.48 * ci), 1.12);
      const a = Math.pow(RIN / rho, 2.7) * 0.1 * rnd();
      if (a < 0.004) continue;
      g.strokeStyle = 'rgba(' + col + ',' + a.toFixed(4) + ')';
      g.lineWidth = 0.012 + rnd() * 0.06;
      g.beginPath();
      g.ellipse(0, 0, rho, ry, 0, f0, f0 + 0.2 + rnd() * 0.8);
      g.stroke();
    }

    // The photon ring: light that went round the hole one or more times before
    // getting out. It really is a circle — but it is made of beamed light that
    // is many times brighter on one side than the other, so it reads as light
    // rather than as trim.
    if (pass === 0) {
      g.strokeStyle = beamed(1.08, '255,238,208', 0.22, false);
      g.lineWidth = 0.3;
      g.beginPath(); g.ellipse(0, 0, 1.08, 1.08, 0, 0, TAU); g.stroke();
      g.strokeStyle = beamed(1.046, '255,250,238', 1.15, false);
      g.lineWidth = 0.042;
      g.beginPath(); g.ellipse(0, 0, 1.046, 1.046, 0, 0, TAU); g.stroke();
    }

    texCache.set(key, c);
    return c;
  }

  // ------------------------------------------------------------------ scene
  //
  // The disc is not integrated body by body — tens of thousands of stars across
  // a dozen live universes never could be — but neither is it faked. Every star
  // here follows a closed-form solution of motion in a galactic potential:
  //
  //   Omega(r)   how fast the circular orbit at radius r goes round. Rising in
  //              the middle, flattening off outside: a real rotation curve, not
  //              Kepler's law, because most of the mass is not in the middle.
  //   kappa(r)   the epicyclic frequency — the rate at which a star that is not
  //              on a circular orbit swings in and out through it. Derived from
  //              Omega rather than invented, so eccentric orbits precess by the
  //              right amount and the disc shears the way a real one does.
  //   nu(r)      the vertical frequency: stars bob up and down through the
  //              midplane, which is what gives the disc a thickness instead of
  //              making it a sheet of paper.
  //
  // The spiral arms are not made of stars. They are a density wave turning at
  // its own steady pattern speed, and stars drift through it — overtaking it
  // inside the corotation radius and falling behind outside. That matters for
  // more than accuracy: arms made of stars wind themselves into a tighter and
  // tighter coil until they vanish, which is the oldest known problem in
  // galactic dynamics, and it would have quietly eaten this scene alive.
  //
  // The handful of objects few enough to integrate — the stars, and the black
  // holes they leave behind — are integrated for real, in that same potential,
  // pulling on each other as they go.
  const OMEGA = (r) => 0.26 / (0.3 + r);
  // kappa^2 = 4 Omega^2 (1 + (r / 2 Omega) dOmega/dr), worked through for this
  // particular curve. Twice Omega at the centre where rotation is solid-body,
  // falling to root two Omega where the curve goes flat.
  const KAPPA = (r) => OMEGA(r) * Math.sqrt((2 * (0.6 + r)) / (0.3 + r));
  const NU = (r) => OMEGA(r) * 1.9;

  class Universe {
    constructor() {
      // Nothing in the sky is presented face-on to us. A random tilt and a
      // random angle on the sky turn every circle in the scene into an ellipse,
      // which is most of the difference between a diagram and a photograph.
      this.ci = rand(0.28, 0.9);          // cosine of the disc's inclination
      this.sn = Math.sqrt(1 - this.ci * this.ci);
      const pa = Math.random() * TAU;     // position angle on the sky
      this.cp = Math.cos(pa);
      this.sp = Math.sin(pa);
      this.spin = Math.random() < 0.5 ? 1 : -1;
      this.age = 0;
      this.born = 0;
      this.motes = [];
      this.haze = [];
      this.dust = [];
      this.stars = [];
      this.holes = [];
      this.blasts = [];
      this.starTimer = rand(0.5, 1.8);

      // The spiral pattern: how many arms, how tightly they wind, and the one
      // speed the whole pattern turns at — a speed no star in it shares.
      this.arms = 2 + ((Math.random() * 2) | 0);
      this.swirl = rand(2.2, 3.4);
      this.omp = OMEGA(rand(0.45, 0.7)) * this.spin;   // pattern speed
      const armCol = pick(ARM), bulgeCol = pick(BULGE);

      // Three populations. `arm` marks the ones that trace the wave: young blue
      // stars burn out long before they can drift away from where they formed,
      // so they light up only where the arm is now. The rest is the smooth old
      // disc that the wave passes through and leaves behind.
      for (let i = 0; i < 3000; i++) {
        const roll = Math.random();
        let r0, size, col, bright, arm, thick;
        if (roll < 0.16) {
          // Bulge: hot, round and old. It bobs so far out of the plane that it
          // is a spheroid rather than a disc, which is why it stays round when
          // the disc is edge-on.
          r0 = 0.03 + Math.pow(Math.random(), 1.7) * 0.3;
          size = rand(0.4, 1.5);
          col = Math.random() < 0.5 ? bulgeCol : pick(BULGE);
          bright = rand(0.32, 0.95);
          arm = 0;
          thick = rand(0.35, 0.95);
        } else if (roll < 0.62) {
          r0 = 0.09 + Math.pow(Math.random(), 0.55) * 0.92;
          size = rand(0.7, 2.4);
          col = Math.random() < 0.11 ? pick(HII) : Math.random() < 0.7 ? armCol : pick(ARM);
          bright = rand(0.5, 1.15);
          arm = 1;
          thick = rand(0.006, 0.03);   // young stars have barely left the plane
        } else {
          r0 = 0.06 + Math.pow(Math.random(), 0.7) * 0.95;
          size = rand(0.45, 1.7);
          col = pick(FIELD);
          bright = rand(0.2, 0.52);
          arm = 0;
          thick = rand(0.02, 0.075);
        }
        const om = OMEGA(r0) * this.spin;
        const kap = KAPPA(r0);
        // Eccentricity, as an epicyclic amplitude. Old stars have been
        // scattered for longer and swing further in and out.
        const ecc = arm ? rand(0, 0.05) : rand(0.01, 0.16);
        this.motes.push({
          r0, size, col, bright, arm,
          a0: Math.random() * TAU,
          om, kap,
          A: r0 * ecc,
          q: (2 * om) / (kap * r0),     // how far the epicycle swings in angle
          phi: Math.random() * TAU,
          Z: r0 * thick,
          nu: NU(r0),
          psi: Math.random() * TAU,
          tw: rand(0, TAU),
          tws: rand(1.1, 3.2),
        });
      }

      // Unresolved light. A galaxy is not a scatter of separate points — most
      // of what you see is the blur of stars too faint and too many to pick
      // out. Without this layer the arms read as glitter on black.
      for (let i = 0; i < 64; i++) {
        const onArm = Math.random() < 0.62;
        const r0 = onArm
          ? 0.1 + Math.pow(Math.random(), 0.6) * 0.9
          : 0.04 + Math.pow(Math.random(), 0.85) * 0.95;
        this.haze.push({
          r0,
          a0: Math.random() * TAU,
          om: OMEGA(r0) * this.spin,
          arm: onArm ? 1 : 0,
          size: rand(0.07, 0.2) * (onArm ? 1 : 1.3),
          col: onArm ? armCol : (r0 < 0.25 ? bulgeCol : pick(FIELD)),
          alpha: rand(0.05, 0.13) * (onArm ? 1.3 : 0.5),
        });
      }

      // Dust. Everything else in this scene adds light; dust is the only thing
      // that takes it away, and without something opaque in front of the glow
      // the whole picture stays translucent and drawn. It piles up against the
      // leading edge of the wave, which is where the lanes are in a real spiral
      // and why they run just inside the bright blue arm.
      for (let i = 0; i < 280; i++) {
        const nuclear = Math.random() < 0.13;
        const r0 = nuclear ? rand(0.05, 0.2) : 0.12 + Math.pow(Math.random(), 0.75) * 0.8;
        this.dust.push({
          r0,
          a0: Math.random() * TAU,
          om: OMEGA(r0) * this.spin,
          arm: nuclear ? 0 : 1,
          size: rand(0.03, 0.095) * (nuclear ? 0.6 : 1),
          alpha: rand(0.22, 0.72),
        });
      }

      // The nucleus. Every galaxy has one, it is there from the beginning, and
      // under the theory it is a universe like any other — but it is ONE, and
      // the disc will go on making millions of the small ones.
      this.holes.push(this._hole(0, 0, 0, 0, true));

      // Stars whipping round the nucleus, the way the S-cluster does around
      // Sgr A*. The real ones are wildly eccentric — S2 comes five times closer
      // at perihelion than at aphelion — so these are ellipses that precess,
      // not circles.
      const inner = HOLE_R * CORE_R;
      for (let i = 0; i < 70; i++) {
        const semi = inner * rand(1.4, 3.2);
        const n = (0.021 / Math.pow(semi, 1.5)) * this.spin;
        this.motes.push({
          r0: semi,
          size: rand(0.5, 1.5),
          col: pick(STARLIGHT),
          bright: rand(0.45, 1),
          arm: 0,
          a0: Math.random() * TAU,
          om: n,
          kap: Math.abs(n) * 0.94,      // a slow prograde precession of the ellipse
          A: semi * rand(0.15, 0.62),
          q: 1.7,
          phi: Math.random() * TAU,
          Z: semi * rand(0.1, 0.7),
          nu: Math.abs(n) * 1.02,
          psi: Math.random() * TAU,
          tw: rand(0, TAU),
          tws: rand(1.4, 3.6),
        });
      }
    }

    /**
     * A black hole, at a place and moving at a speed. Its spin axis has nothing
     * to do with the galaxy's, so the accretion disc gets its own tilt and its
     * own sense of rotation.
     */
    _hole(x, y, vx, vy, core) {
      const pa = Math.random() * TAU;
      const qi = (Math.random() * QCI.length) | 0;
      return {
        x, y, vx, vy, core,
        m: core ? 0 : 0.00006,
        size: 1,
        open: core ? 1 : 0,
        qi, ci: QCI[qi],
        cp: Math.cos(pa), sp: Math.sin(pa),
        dir: Math.random() < 0.5 ? 1 : -1,
        feed: core ? 0.85 : 1.6,
        spin: rand(0, TAU),
        child: null,
        sys: null,
      };
    }

    /** Kick things off mid-story so a fresh universe is never dull. */
    prime() {
      this.born = 1;
      this.age = 6;
      this.holes[0].size = CORE_R;
      this._star(0.72);
      this._star(0.15);
      return this;
    }

    _star(progress) {
      const life = rand(5, 9);
      const r = rand(0.2, 0.8);
      const a = Math.random() * TAU;
      // Launched off the circular speed by up to a tenth or so, with a kick
      // inward or out. Nothing here starts on a perfect circle, so nothing here
      // traces one.
      const vc = OMEGA(r) * r * this.spin;
      const tang = vc * rand(0.88, 1.08), radl = Math.abs(vc) * rand(-0.13, 0.13);
      const ca = Math.cos(a), sa = Math.sin(a);
      // A handful of worlds, which is the whole point: they keep these orbits
      // after the star dies, and an orbit around nothing is unmistakably a
      // black hole rather than a hole cut in the picture.
      const spa = Math.random() * TAU;
      const sys = {
        list: [],
        ci: rand(0.08, 0.95),
        cp: Math.cos(spa), sp: Math.sin(spa),
      };
      const np = 2 + ((Math.random() * 3) | 0);
      let pr = 0.04;
      for (let i = 0; i < np; i++) {
        pr += rand(0.016, 0.03);
        sys.list.push({
          r: pr,
          a0: Math.random() * TAU,
          n: (1.1 / Math.pow(pr / 0.05, 1.5)) * this.spin,
          // Near-circular, but not circular — and a world on an ellipse sweeps
          // fastest at perihelion, which shows in the trail behind it.
          e: rand(0.02, 0.15),
          size: rand(1, 2.1),
          col: pick(PLANET),
        });
      }
      this.stars.push({
        sys,
        x: ca * r, y: sa * r,
        vx: -sa * tang + ca * radl,
        vy: ca * tang + sa * radl,
        t: life * (progress || 0),
        life,
        m: 0.00004,
        size: rand(1, 1.8),
        col: pick(STARLIGHT),
        // In Smolin's picture there is no threshold to clear: a star that
        // collapses becomes a singularity, and that singularity is a universe.
        doomed: Math.random() < 0.5,
      });
    }

    /** A supernova: ragged ejecta, not an expanding outline. */
    _blast(x, y, power) {
      const parts = [];
      const n = (22 + Math.random() * 16 * power) | 0;
      for (let i = 0; i < n; i++) {
        parts.push({
          ang: Math.random() * TAU,
          // A wide spread of speeds is what makes the shell look torn rather
          // than drawn; one speed for all of them is a circle again.
          spd: rand(0.012, 0.075) * power * rand(0.45, 1.35),
          size: rand(0.6, 2.4),
          hot: Math.random() < 0.18,   // oxygen knots among the hydrogen
        });
      }
      this.blasts.push({ u: x, v: y, t: 0, life: 2.4 + power, power, parts });
    }

    /**
     * Stars and remnants move under real forces: the galaxy's own pull, plus
     * whatever they exert on one another. There are never more than eight of
     * them in a universe, so this costs nothing — and it is the difference
     * between orbits that drift and precess and orbits that are drawn on.
     */
    _gravitate(dt) {
      const all = [];
      for (let i = 0; i < this.stars.length; i++) all.push(this.stars[i]);
      for (let i = 0; i < this.holes.length; i++) {
        if (!this.holes[i].core) all.push(this.holes[i]);
      }
      for (let i = 0; i < all.length; i++) {
        const b = all[i];
        const r = Math.hypot(b.x, b.y) || 1e-6;
        // The galaxy's pull, read straight off the rotation curve: a circular
        // orbit at radius r needs an inward acceleration of Omega squared r.
        const om = OMEGA(r);
        let ax = -om * om * b.x, ay = -om * om * b.y;
        for (let j = 0; j < all.length; j++) {
          if (j === i) continue;
          const o = all[j];
          const dx = o.x - b.x, dy = o.y - b.y;
          // Softened, so a close pass perturbs an orbit instead of detonating it.
          const d2 = dx * dx + dy * dy + 0.0025;
          const f = o.m / (d2 * Math.sqrt(d2));
          ax += dx * f; ay += dy * f;
        }
        b.vx += ax * dt; b.vy += ay * dt;
        b.x += b.vx * dt; b.y += b.vy * dt;
        // Anything that works its way out past the edge of the disc is eased
        // back in rather than sailing off screen for good.
        const nr = Math.hypot(b.x, b.y);
        if (nr > 1.15) {
          const k = 1 - Math.min(0.5, (nr - 1.15) * 2) * dt;
          b.vx *= k; b.vy *= k;
        }
      }
    }

    update(dt, level) {
      this.age += dt;
      if (this.born < 1) this.born = Math.min(1, this.born + dt * 0.7);

      // The disc itself needs no stepping: every star in it is a closed-form
      // function of this universe's own clock, so it cannot drift, blow up or
      // accumulate error, however long this runs.
      for (let i = 0; i < this.motes.length; i++) this.motes[i].tw += this.motes[i].tws * dt;

      this._gravitate(dt);

      this.starTimer -= dt;
      if (this.starTimer <= 0 && this.stars.length < 4) {
        this.starTimer = rand(1.3, 3.0);
        this._star(0);
      }

      for (let i = this.stars.length - 1; i >= 0; i--) {
        const s = this.stars[i];
        s.t += dt;
        if (s.t < s.life) continue;
        this.stars.splice(i, 1);
        if (s.doomed && this.holes.length < 4) {
          // The remnant carries on with exactly the position and velocity its
          // progenitor had. It is the same object, minus the light.
          const h = this._hole(s.x, s.y, s.vx, s.vy, false);
          h.sys = s.sys;
          this.holes.push(h);
          this._blast(s.x, s.y, 1.6);
        } else {
          this._blast(s.x, s.y, 0.7);
        }
      }

      for (let i = 0; i < this.holes.length; i++) {
        const h = this.holes[i];
        h.open = Math.min(1, h.open + dt * 0.55);
        h.spin += dt * 1.7;
        // A stellar remnant is briefly very bright — it is swallowing the
        // fallback of its own progenitor — and then settles to almost nothing,
        // because most black holes are not eating anything at all.
        if (!h.core) h.feed += (0.28 - h.feed) * Math.min(1, dt * 0.16);
        // A seed, then accretion and mergers. Whatever the seed channel turns
        // out to be, the nucleus is not born at the mass we observe it at.
        if (h.core) h.size += (CORE_R - h.size) * Math.min(1, dt * 0.13);
        // Every hole is a universe, but only the ones you might actually reach
        // get built. Below the root, one branch is enough — three-way branching
        // costs forty live universes by depth three and shows almost none of it.
        if (!h.child && h.open > 0.42 && level < MAX_LEVEL && (level === 0 || i === 0)) {
          h.child = new Universe();
        }
        if (h.child && level < MAX_LEVEL) h.child.update(dt, level + 1);
      }

      for (let i = this.blasts.length - 1; i >= 0; i--) {
        const b = this.blasts[i];
        b.t += dt;
        if (b.t > b.life) this.blasts.splice(i, 1);
      }
    }

    // ------------------------------------------------------------------ draw
    draw(cx, cy, R0, alpha, level) {
      const R = R0;
      // Inflation is a scale factor, not an explosion with a location. The disc
      // occupies its whole extent from the first instant; what changes is the
      // separation between everything in it. There is no centre it grows from
      // and no edge it grows into, which is why, from anywhere inside, it looks
      // like it is expanding everywhere at once.
      const RD = R * (0.14 + 0.86 * ease(this.born));
      if (alpha <= 0.02 || R < 1.5) return;
      // Everything this universe contains, holes and their discs included, fits
      // inside 1.6R of its centre, so if that box misses the screen, all of it
      // does. (This used to bail only for small R, which meant a universe zoomed
      // to thirty thousand pixels across drew its every hole from off screen.)
      if (cx + R * 1.6 < 0 || cx - R * 1.6 > W || cy + R * 1.6 < 0 || cy - R * 1.6 > H) return;

      // Inside a horizon that already fills the screen, none of the surrounding
      // universe is visible — but its holes still draw, because the one being
      // entered is the opaque disc doing the covering.
      const own = alpha;
      const lit = !(level === 0 && occlude);
      const CP = this.cp, SP = this.sp, CI = this.ci, SN = this.sn;
      const T = this.age;
      // Where the spiral pattern is right now. A star sits in an arm when this
      // combination of its angle and its radius comes back round to zero, and
      // since the pattern turns at its own speed and the star turns at its own,
      // every star drifts through the arms rather than being stuck in one.
      const ARMS = this.arms, PHASE = this.omp * T, SWIRL = this.swirl;

      ctx.globalCompositeOperation = 'lighter';

      // The bulge: a real ellipsoid of old stars, projected. Not a wash of
      // colour over the whole frame — that was the strongest tell of all.
      const wide = 1 / (1 + (R / HALFDIAG) * (R / HALFDIAG));
      if (lit && own * wide > 0.03 && warp < 0.3) {
        const bc = 1 - 0.32 * (1 - this.ci);
        ctx.globalAlpha = own * 0.2 * wide;
        blitE(glow('255,206,150', 128, 0, 2.6), cx, cy, R * 0.3, R * 0.3 * bc, CP, SP);
        ctx.globalAlpha = own * 0.16 * wide;
        blitE(glow('255,236,204', 128, 0.03, 3.4), cx, cy, R * 0.1, R * 0.1 * bc, CP, SP);
      }

      // The bounce, seen from inside: the whole of space alight at once, not a
      // fireball expanding through it.
      if (lit && this.born < 1) {
        const f = 1 - this.born;
        ctx.globalAlpha = own * f * f * 0.85;
        blitE(glow('236,240,255', 128, 0.35, 1.4), cx, cy, R * 1.2, R * 1.2, 1, 0);
      }

      // The unresolved sheen the arms are made of.
      if (lit && warp < 0.3 && own * wide > 0.02) {
        const hsprite = glow('255,255,255', 128, 0, 2.0);
        for (let i = 0; i < this.haze.length; i++) {
          const z = this.haze[i];
          const ang = z.a0 + z.om * T;
          const u = Math.cos(ang) * z.r0, v = Math.sin(ang) * z.r0 * CI;
          const px = cx + (u * CP - v * SP) * RD;
          const py = cy + (u * SP + v * CP) * RD;
          const rx = z.size * R * 1.5, ry = z.size * R * (0.35 + 0.65 * CI);
          // Once one of these is larger than the screen it is a flat wash and
          // nothing else, and it costs a full-frame blend to say so.
          if (rx > HALFDIAG * 1.5) continue;
          if (px + rx < 0 || px - rx > W || py + rx < 0 || py - rx > H) continue;
          let za = z.alpha;
          if (z.arm) {
            const e = 0.5 + 0.5 * Math.cos(ARMS * (ang - SWIRL * z.r0 - PHASE));
            const e2 = e * e;
            za *= 0.12 + 2.6 * e2 * e2;
          }
          ctx.globalAlpha = own * za * wide;
          blitE(glow(z.col, 128, 0, 2.0), px, py, rx, ry, CP, SP);
        }
        void hsprite;
      }

      const unit = R / 320;

      // Motes. Skipped wholesale once this universe has faded past seeing; its
      // holes below still run, because the destination is inside one of them.
      if (lit) {
      // Level of detail by on-screen size, not by nesting depth: a disc only a
      // hundred pixels across does not need every mote resolved.
      let step = R > 190 ? 1 : R > 70 ? 2 : 3;
      // A streak covers many times the area of a point, so at speed the same
      // frame budget buys far fewer of them. Thinning them out alone would just
      // look like a dimming, so the survivors carry the missing light.
      const dec = warp > 0.5 ? 3 : warp > 0.15 ? 2 : 1;
      const relight = Math.min(2.1, dec);
      step *= dec;
      for (let i = 0; i < this.motes.length; i += step) {
        const m = this.motes[i];
        // The epicycle: the star swings in and out through its guiding radius
        // at the epicyclic frequency, and runs ahead and falls back in angle by
        // just as much as conservation of angular momentum requires.
        const ph = m.kap * T + m.phi;
        const rad = m.r0 + m.A * Math.cos(ph);
        const ang = m.a0 + m.om * T - m.q * m.A * Math.sin(ph);
        // ...and bobs through the midplane, which is what the disc's thickness
        // is made of. Height shows up along the minor axis of the projection.
        const zz = m.Z * Math.sin(m.nu * T + m.psi);
        const u = Math.cos(ang) * rad, v = Math.sin(ang) * rad * CI - zz * SN;
        const px = cx + (u * CP - v * SP) * RD;
        const py = cy + (u * SP + v * CP) * RD;
        if (px < -30 || px > W + 30 || py < -30 || py > H + 30) continue;
        const tw = 0.72 + 0.28 * Math.sin(m.tw);
        const s = m.size * tw * unit * 5.6;
        if (s < 0.7 || s > 300) continue;
        let a = own * m.bright * tw * 0.72 * relight;
        // Young stars live and die inside the wave that made them, so they are
        // only lit where the arm is now. This is why the arms hold their shape
        // for ever instead of winding themselves out of existence.
        if (m.arm) {
          // Raised to the fourth: the crest of a density wave is narrow, and a
          // broad cosine bump spreads the young stars over half the disc and
          // leaves no arms at all.
          const e = 0.5 + 0.5 * Math.cos(ARMS * (ang - SWIRL * m.r0 - PHASE));
          const e2 = e * e;
          a *= 0.05 + 4.4 * e2 * e2;
        }
        if (a < 0.02) continue;
        if (warp > 0.001) {
          // Drawn out along the line of travel. Things off to the side sweep
          // past faster than things dead ahead, so they stretch further — which
          // is what sells it as speed rather than a blur filter.
          const dx = px - W / 2, dy = py - H / 2;
          const d = Math.hypot(dx, dy) || 1;
          const len = Math.min(230, s * (1 + warp * warp * 15 * (0.2 + d / HALFDIAG)));
          ctx.globalAlpha = s > 150 ? a * 150 / s : a;
          blitR(glow(m.col), px, py, len, s, dx / d, dy / d);
          continue;
        }
        if (s > 13) {
          // Close up a star does not become a soft disc the size of a house; it
          // stays a point with a halo around it. Drawing it as one big blurred
          // sprite is what turned the whole field into bokeh.
          ctx.globalAlpha = a * 0.15;
          ctx.drawImage(glow(m.col, 64, 0, 3.4), px - s / 2, py - s / 2, s, s);
          const cs = 13;
          ctx.globalAlpha = Math.min(1, a * 1.35);
          ctx.drawImage(glow(m.col, 32, 0.24, 2.6), px - cs / 2, py - cs / 2, cs, cs);
        } else {
          ctx.globalAlpha = a;
          ctx.drawImage(glow(m.col), px - s / 2, py - s / 2, s, s);
        }
      }
      }

      // Dust, in front of everything it crosses. The only subtractive thing in
      // the frame, and the reason the arms read as material rather than paint.
      if (lit && warp < 0.35 && R > 40) {
        ctx.globalCompositeOperation = 'source-over';
        const dsprite = glow(DUST, 64, 0.08, 1.7);
        const dstep = R > 280 ? 1 : 2;
        for (let i = 0; i < this.dust.length; i += dstep) {
          const d = this.dust[i];
          const ang = d.a0 + d.om * T;
          const u = Math.cos(ang) * d.r0, v = Math.sin(ang) * d.r0 * CI;
          const px = cx + (u * CP - v * SP) * RD;
          const py = cy + (u * SP + v * CP) * RD;
          const s = d.size * R;
          if (s > HALFDIAG * 1.2) continue;
          if (px + s * 2 < 0 || px - s * 2 > W || py + s * 2 < 0 || py - s * 2 > H) continue;
          let da = d.alpha;
          if (d.arm) {
            // Half a radian ahead of the bright arm: gas piles up against the
            // leading edge of the wave, which is where it turns into stars.
            const e = 0.5 + 0.5 * Math.cos(ARMS * (ang - SWIRL * d.r0 - PHASE) + 0.7);
            const e2 = e * e;
            da *= 0.08 + 2.1 * e2 * e2;
          }
          // Drawn out along the lane's own direction of travel. Orienting them
          // all to the same angle instead turns the lanes into parallel
          // scratches across the picture.
          const tu = -Math.sin(ang) * d.r0, tv = Math.cos(ang) * d.r0 * CI;
          const tx = tu * CP - tv * SP, ty = tu * SP + tv * CP;
          const td = Math.hypot(tx, ty) || 1;
          ctx.globalAlpha = own * da;
          blitE(dsprite, px, py, s * 1.7, s * 0.62, tx / td, ty / td);
        }
        ctx.globalCompositeOperation = 'lighter';
      }

      // Supernovae: torn shells of ejecta with the shock still lit inside them.
      if (lit && warp < 0.4) for (let i = 0; i < this.blasts.length; i++) {
        const b = this.blasts[i];
        const k = b.t / b.life;
        const fade = 1 - k;
        // Shock breakout — a genuine flash, over in a fraction of a second.
        if (b.t < 0.5) {
          const f = 1 - b.t / 0.5;
          const v0 = b.v * CI;
          const px = cx + (b.u * CP - v0 * SP) * RD;
          const py = cy + (b.u * SP + v0 * CP) * RD;
          const fs = unit * 40 * b.power * (1 + (1 - f) * 2.5);
          ctx.globalAlpha = own * f * f * 0.9;
          ctx.drawImage(glow('255,246,226', 128, 0.06, 2.2), px - fs, py - fs, fs * 2, fs * 2);
        }
        if (fade <= 0) continue;
        const spread = 1 - Math.exp(-b.t * 1.5);
        const col = k < 0.25 ? '255,238,214' : k < 0.55 ? '255,172,96' : '226,88,64';
        const hotcol = k < 0.45 ? '176,232,255' : '120,190,210';
        for (let j = 0; j < b.parts.length; j++) {
          const p = b.parts[j];
          const dd = p.spd * spread;
          const u = b.u + Math.cos(p.ang) * dd;
          const v = (b.v + Math.sin(p.ang) * dd) * CI;
          const px = cx + (u * CP - v * SP) * RD;
          const py = cy + (u * SP + v * CP) * RD;
          if (px < -20 || px > W + 20 || py < -20 || py > H + 20) continue;
          const s = p.size * unit * 9 * (1 + spread * 1.6);
          if (s < 0.6) continue;
          ctx.globalAlpha = own * fade * fade * 0.6;
          ctx.drawImage(glow(p.hot ? hotcol : col, 64, 0.05, 2.4), px - s / 2, py - s / 2, s, s);
        }
      }

      // Stars: swell, redden, tremble, and — if they are heavy enough — fall in
      // on themselves. The implosion is the beat that makes the black hole
      // legible; without it a hole just appears where a star used to be.
      if (lit) for (let i = 0; i < this.stars.length; i++) {
        const s = this.stars[i];
        const k = s.t / s.life;
        const v = s.y * CI;
        const px = cx + (s.x * CP - v * SP) * RD;
        const py = cy + (s.x * SP + v * CP) * RD;
        this._drawSystem(px, py, s.sys, R, own, 1, T);

        let swell = 1 + k * k * k * 2.2;
        let core = 0.32;
        const fall = s.doomed ? (s.t - (s.life - 0.5)) / 0.5 : -1;
        if (fall > 0) {
          // Freefall: the envelope drops away in well under a second, and what
          // is left of the light is squeezed into a point.
          swell *= Math.max(0.05, 1 - fall * fall * 0.97);
          core = 0.32 + fall * 0.5;
        }
        const size = s.size * swell * unit * 13;
        if (size < 0.8) continue;
        ctx.globalAlpha = own * 0.7;
        ctx.drawImage(glow(k > 0.75 && s.doomed ? '255,166,118' : s.col, 64, 0.07, 3.0),
          px - size / 2, py - size / 2, size, size);
        const cs = Math.min(size * core, 26);
        ctx.globalAlpha = own;
        ctx.drawImage(glow('255,255,255', 32, 0.32, 2), px - cs / 2, py - cs / 2, cs, cs);
        if (s.doomed && k > 0.82) {
          const t = (k - 0.82) / 0.18;
          ctx.globalAlpha = own * t * (0.5 + 0.5 * Math.sin(s.t * 34)) * 0.7;
          const ws = size * 2.3 * (fall > 0 ? 1 + fall * 3 : 1);
          ctx.drawImage(glow('255,138,88', 64, 0.02, 2.6), px - ws / 2, py - ws / 2, ws, ws);
        }
      }

      // Singularities, each with its cosmos inside.
      for (let i = 0; i < this.holes.length; i++) {
        const h = this.holes[i];
        const v = h.y * CI;
        this._drawHole(cx + (h.x * CP - v * SP) * RD, cy + (h.x * SP + v * CP) * RD,
          Math.max(1.2, R * HOLE_R * h.size * h.open), h, own, alpha, level, T);
      }

      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
    }

    /**
     * Worlds on their orbits — the same ones before and after the collapse. The
     * orbit is shown by the trail the world leaves along it, never by a drawn
     * ring: a stroked circle is the most artificial mark you can put on screen.
     */
    _drawSystem(x, y, sys, R, alpha, dim, T) {
      if (!sys) return;
      const first = sys.list[0].r * R;
      if (first < 3) return;
      const cp = sys.cp, sp = sys.sp, ci = sys.ci;
      ctx.globalCompositeOperation = 'lighter';
      const trail = first > 26 && warp < 0.2;
      for (let i = 0; i < sys.list.length; i++) {
        const q = sys.list[i];
        // Capped: a world seen from close up is a small hard disc, not a cloud.
        // Without the clamp they swell into blobs the size of the star they lost.
        const s = Math.min(20, q.size * (R / 320) * 5.5);
        if (s < 0.6) continue;
        const M = q.a0 + q.n * T;
        if (trail) {
          const tsprite = glow(q.col, 32, 0, 2.4);
          const dirn = q.n < 0 ? -1 : 1;
          for (let j = 1; j <= 5; j++) {
            // Stepped back in mean anomaly, so the spacing of the trail follows
            // the second of Kepler's laws: crowded out at aphelion, drawn thin
            // where the world is running fastest.
            const mj = M - j * 0.13 * dirn;
            const nj = mj + 2 * q.e * Math.sin(mj) + 1.25 * q.e * q.e * Math.sin(2 * mj);
            const rj = (q.r * (1 - q.e * q.e)) / (1 + q.e * Math.cos(nj));
            const u = Math.cos(nj) * rj, v = Math.sin(nj) * rj * ci;
            const px = x + (u * cp - v * sp) * R;
            const py = y + (u * sp + v * cp) * R;
            ctx.globalAlpha = alpha * dim * 0.12 * (1 - j / 6);
            const ts = s * (1 - j * 0.12);
            ctx.drawImage(tsprite, px - ts, py - ts, ts * 2, ts * 2);
          }
        }
        // Where the world is now, on its ellipse rather than on a circle.
        const nu = M + 2 * q.e * Math.sin(M) + 1.25 * q.e * q.e * Math.sin(2 * M);
        const rr = (q.r * (1 - q.e * q.e)) / (1 + q.e * Math.cos(nu));
        const u = Math.cos(nu) * rr, v = Math.sin(nu) * rr * ci;
        const px = x + (u * cp - v * sp) * R;
        const py = y + (u * sp + v * cp) * R;
        if (px < -20 || px > W + 20 || py < -20 || py > H + 20) continue;
        ctx.globalAlpha = alpha * dim * 0.45;
        ctx.drawImage(glow(q.col, 32, 0.1, 2.8), px - s, py - s, s * 2, s * 2);
        ctx.globalAlpha = alpha * dim;
        ctx.drawImage(glow(q.col, 32, 0.62, 2.6), px - s / 2, py - s / 2, s, s);
      }
    }

    _drawHole(x, y, hr, h, alpha, kidAlpha, level, T) {
      // TEXE shadow radii is the outer edge of the disc and its bloom. Beyond
      // that there is nothing to draw, at any size.
      const reach = hr * TEXE;
      if (x + reach < 0 || x - reach > W || y + reach < 0 || y - reach > H) return;

      // Once the shadow itself is larger than the screen, every lit part of the
      // hole is outside the frame. And at speed the disc is unreadable and
      // ruinously expensive — but it has to fade rather than switch off, or a
      // hole the size of the screen blinks as the streaks come up.
      const structured = hr > 4 && hr < HALFDIAG * 1.05;
      const feed = Math.min(1, alpha * h.feed) * Math.max(0, 1 - warp / 0.55);
      const ext = hr * 2 * TEXE;

      ctx.globalCompositeOperation = 'lighter';
      if (!structured) {
        // Far off, a black hole is a point of hot light with a bite out of it.
        if (hr < HALFDIAG * 1.05 && feed > 0.03) {
          ctx.globalAlpha = feed * 0.5;
          blitE(glow('255,196,120', 64, 0.05, 2.4), x, y,
            hr * 3.4, hr * 3.4 * (0.35 + 0.65 * h.ci), h.cp, h.sp);
        }
      } else if (feed > 0.02) {
        ctx.globalAlpha = feed;
        blitT(discTex(h.qi, 0), x, y, ext, h.cp, h.sp, h.dir);
        this._hotspots(x, y, hr, h, feed, 0);
      }

      // The one opaque thing on screen.
      ctx.globalCompositeOperation = 'source-over';
      ctx.globalAlpha = alpha;
      ctx.fillStyle = '#000';
      ctx.beginPath();
      ctx.arc(x, y, hr, 0, TAU);
      ctx.fill();

      // And the universe behind it. Clipped to the horizon, so from far away it
      // is a black disc and up close it is everything. Held back until the
      // horizon is large on screen: lit from across the galaxy it reads as a
      // portal, and a black hole at that distance is a black disc and nothing
      // else.
      if (h.child) {
        const cr = hr * CHILD_FILL;
        if (cr > 15) {
          ctx.save();
          ctx.beginPath();
          ctx.arc(x, y, hr, 0, TAU);
          ctx.clip();
          h.child.draw(x, y, cr, kidAlpha * Math.min(1, (cr - 15) / 45), level + 1);
          ctx.restore();
        }
      }

      // The near side of the disc passes between us and the hole, so it goes on
      // last — over the shadow, and over whatever is inside it.
      ctx.globalCompositeOperation = 'lighter';
      if (structured && feed > 0.02) {
        ctx.globalAlpha = feed;
        blitT(discTex(h.qi, 1), x, y, ext, h.cp, h.sp, h.dir);
        this._hotspots(x, y, hr, h, feed, 1);
      }

      // Still going round, still on the same orbits, with nothing at the centre
      // to light them any more.
      this._drawSystem(x, y, h.sys, hr / HOLE_R, alpha, 0.75, T);
    }

    /**
     * Clumps orbiting in the disc. The baked texture cannot move, and a black
     * hole that holds perfectly still is a decal; these are what make it boil.
     */
    _hotspots(x, y, hr, h, feed, pass) {
      if (hr < 14) return;
      const ci = h.ci, sn = Math.sqrt(1 - ci * ci);
      for (let i = 0; i < 4; i++) {
        const f = h.spin * (0.5 + i * 0.11) + i * 1.9;
        const sf = Math.sin(f);
        if ((sf > 0 ? 1 : 0) !== pass) continue;
        const rho = (1.45 + i * 0.42) * hr;
        const ry = pass ? rho * ci : Math.max(rho * (0.52 + 0.48 * ci), hr * 1.12);
        const lx = rho * Math.cos(f) * h.dir, ly = ry * sf;
        const px = x + lx * h.cp - ly * h.sp;
        const py = y + lx * h.sp + ly * h.cp;
        const s = hr * 0.5;
        if (px + s * 3 < 0 || px - s * 3 > W || py + s * 3 < 0 || py - s * 3 > H) continue;
        const dop = 1 + 0.42 * sn * Math.cos(f);
        const a = feed * 0.16 * dop * dop * dop * (0.55 + 0.45 * Math.sin(h.spin * 2.3 + i));
        if (a < 0.02) continue;
        // Sheared out along its own orbit by the shear of the disc.
        const tx = -Math.sin(f) * rho * h.dir, ty = ry * Math.cos(f);
        const td = Math.hypot(tx, ty) || 1;
        const cs = (tx * h.cp - ty * h.sp) / td, sns = (tx * h.sp + ty * h.cp) / td;
        ctx.globalAlpha = Math.min(1, a);
        blitR(glow('255,236,206', 64, 0, 2.6), px, py, s * 4.5, s * 1.3, cs, sns);
      }
    }
  }

  // ----------------------------------------------------------------- camera
  // One continuous accelerating fall, all the way through. The horizon grows
  // until its edge leaves the frame; at that exact moment the universe inside it
  // has reached the size a universe is drawn at, so it is promoted to root and
  // nothing on screen moves. Zoom never decreases and never eases to a stop —
  // the only thing that ends is the parent, which thins away as you pass it.

  const DIVE_RATE = 0.36;   // e-folds per second, falling in
  const WARP_BOOST = 2.2;   // extra pull once the streaks come up
  const WARP_IN = 0.85;     // seconds to reach full stretch
  const WARP_OUT = 1.2;     // seconds to settle out of it
  let root = null, target = null;
  let camX = 0, camY = 0, zoom = 1, mode = 'hold', hold = 2.4, lock = 0;
  let time = 0, last = performance.now();

  const baseR = () => Math.min(W, H) * 0.38;

  /** The zoom at which this hole's child is drawn at exactly natural framing. */
  const framingZoom = (h) => 1 / (HOLE_R * h.size * h.open * CHILD_FILL);

  /** Where a hole sits on screen, in the projected plane of its universe. */
  function holePos(u, h, out) {
    const lv = h.y * u.ci;
    out[0] = h.x * u.cp - lv * u.sp;
    out[1] = h.x * u.sp + lv * u.cp;
  }
  const _hp = [0, 0];

  function camera(dt) {
    veil = Math.max(0, veil - dt / 0.8);
    occlude = false;

    if (mode === 'hold') {
      warp = Math.max(0, warp - dt / WARP_OUT);
      hold -= dt;
      if (hold <= 0 && warp <= 0) {
        // Mostly the disc, occasionally the nucleus. That ratio is the whole
        // argument: the small ones are where the offspring come from.
        const stellar = root.holes.filter((h) => h.child && !h.core);
        const core = root.holes.find((h) => h.child && h.core);
        const best = stellar.length && (!core || Math.random() < 0.75) ? pick(stellar) : core;
        if (best) { target = best; lock = 0; mode = 'dive'; }
      }
      return;
    }

    if (!target || root.holes.indexOf(target) < 0) {
      target = null; mode = 'hold'; hold = 1.4; return;
    }

    // The target is orbiting, and at a hundred times magnification a hundredth
    // of a radian is many screens. Ease onto it, then track it exactly.
    lock = Math.min(1, lock + dt / 1.2);
    const k = Math.max(lock * lock, Math.min(1, 4 * dt));
    holePos(root, target, _hp);
    camX += (_hp[0] - camX) * k;
    camY += (_hp[1] - camY) * k;

    const zt = framingZoom(target);
    zoom *= Math.exp(DIVE_RATE * (mode === 'warp' ? WARP_BOOST : 1) * dt);

    if (mode === 'dive') {
      if (zoom >= zt * 0.3 && target.child) mode = 'warp';
      return;
    }

    warp = Math.min(1, warp + dt / WARP_IN);
    // Past this point the horizon covers every corner of the screen, so the
    // universe outside it has nothing left to contribute.
    occlude = baseR() * zoom * HOLE_R * target.size * target.open >= HALFDIAG * 1.02;

    if (zoom >= zt && warp >= 1) {
      // Whatever the zoom happens to be, dividing by zt reproduces the child at
      // precisely the size it was already being drawn — the promotion is exact
      // even if this frame overshot.
      const carry = zoom / zt;
      root = target.child;
      root.born = 1;
      target = null;
      zoom = carry;
      camX = 0;
      camY = 0;
      // We came through a screen filled edge to edge with the inside of an event
      // horizon, so that is what the next frame opens on. Space fades up from it.
      veil = 1;
      mode = 'hold';
      hold = 2.6;
    }
  }

  // --------------------------------------------------------------- backdrop
  let backdrop = null, bw = 0, bh = 0;
  function makeBackdrop() {
    // Only when the viewport itself changed — a quality step must not reshuffle
    // the star field under the viewer.
    if (backdrop && bw === W && bh === H) return;
    bw = W; bh = H;
    backdrop = document.createElement('canvas');
    backdrop.width = Math.max(1, W);
    backdrop.height = Math.max(1, H);
    const g = backdrop.getContext('2d');
    g.fillStyle = '#030306';
    g.fillRect(0, 0, W, H);

    // Faint patchy cirrus rather than one smooth wash — a single centred
    // gradient reads as a vignette in reverse and gives the whole frame away.
    g.globalCompositeOperation = 'lighter';
    for (let i = 0; i < 26; i++) {
      const r = Math.max(W, H) * rand(0.08, 0.3);
      const x = rand(-0.1, 1.1) * W, y = rand(-0.1, 1.1) * H;
      const grd = g.createRadialGradient(x, y, 0, x, y, r);
      const c = Math.random() < 0.5 ? '40,32,66' : '26,38,60';
      grd.addColorStop(0, 'rgba(' + c + ',' + rand(0.05, 0.14).toFixed(3) + ')');
      grd.addColorStop(1, 'rgba(' + c + ',0)');
      g.fillStyle = grd;
      g.fillRect(x - r, y - r, r * 2, r * 2);
    }

    // Foreground stars, with a proper spread of brightness and colour: a few
    // bright ones with visible haloes among a great many faint points.
    for (let i = 0; i < 560; i++) {
      const x = Math.random() * W, y = Math.random() * H;
      const mag = Math.pow(Math.random(), 3.2);
      const r = 0.25 + mag * 1.9;
      const t = Math.random();
      const c = t < 0.16 ? '255,206,168' : t < 0.34 ? '200,214,255' : '244,244,252';
      if (mag > 0.55) {
        const halo = g.createRadialGradient(x, y, 0, x, y, r * 6);
        halo.addColorStop(0, 'rgba(' + c + ',' + (mag * 0.32).toFixed(3) + ')');
        halo.addColorStop(1, 'rgba(' + c + ',0)');
        g.fillStyle = halo;
        g.fillRect(x - r * 6, y - r * 6, r * 12, r * 12);
      }
      g.fillStyle = 'rgba(' + c + ',' + (0.14 + mag * 0.8).toFixed(3) + ')';
      g.beginPath();
      g.arc(x, y, r, 0, TAU);
      g.fill();
    }
    g.globalCompositeOperation = 'source-over';
  }

  // ------------------------------------------------------------------- loop
  // The piece is fill-rate bound — it is thousands of additive blends over the
  // whole frame — so the honest lever on a slow machine is resolution, not
  // detail. Drop the backing store and let CSS scale it back up.
  let qual = 1, qualClock = 0, slow = 0;
  function pace(dt) {
    qualClock += dt;
    slow = slow * 0.9 + (dt > 0.026 ? 0.1 : 0);
    if (qualClock < 2) return;
    qualClock = 0;
    const want = slow > 0.5 ? Math.max(0.55, qual - 0.2) : slow < 0.1 ? Math.min(1, qual + 0.2) : qual;
    if (want !== qual) { qual = want; resize(); }
  }

  function resize() {
    DPR = Math.min(1.75, window.devicePixelRatio || 1) * qual;
    W = canvas.clientWidth || window.innerWidth;
    H = canvas.clientHeight || window.innerHeight;
    HALFDIAG = Math.hypot(W, H) / 2;
    canvas.width = Math.floor(W * DPR);
    canvas.height = Math.floor(H * DPR);
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    makeBackdrop();
  }

  let paused = false;
  function frame(now) {
    const dt = paused ? 0 : Math.min(0.05, (now - last) / 1000) || 0;
    last = now;
    time += dt;

    pace(dt);
    root.update(dt, 0);
    camera(dt);

    const RS = baseR() * zoom;
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    ctx.globalCompositeOperation = 'source-over';
    ctx.globalAlpha = 1;

    // Drift the field outward with the dive so it does not sit there rigid
    // while the rest of the frame rushes past.
    const bs = 1 + Math.min(0.55, Math.log(Math.max(1, zoom)) * 0.07) + warp * 0.5;
    ctx.globalAlpha = 1;
    ctx.drawImage(backdrop, W / 2 - (W * bs) / 2, H / 2 - (H * bs) / 2, W * bs, H * bs);
    if (veil > 0) {
      ctx.globalAlpha = veil;
      ctx.fillStyle = '#000';
      ctx.fillRect(0, 0, W, H);
      ctx.globalAlpha = 1;
    }

    root.draw(W / 2 - camX * RS, H / 2 - camY * RS, RS, 1, 0);

    ctx.globalCompositeOperation = 'source-over';
    ctx.globalAlpha = 1;
    const vg = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.46, W / 2, H / 2, HALFDIAG * 1.05);
    vg.addColorStop(0, 'rgba(0,0,0,0)');
    vg.addColorStop(1, 'rgba(0,0,0,0.42)');
    ctx.fillStyle = vg;
    ctx.fillRect(0, 0, W, H);

    requestAnimationFrame(frame);
  }

  window.addEventListener('resize', resize);
  resize();
  // Bake every inclination up front: building one mid-dive would stall a frame.
  for (let q = 0; q < QCI.length; q++) { discTex(q, 0); discTex(q, 1); }
  root = new Universe().prime();
  requestAnimationFrame(frame);

  window.__fecundity = {
    get root() { return root; }, get zoom() { return zoom; }, get mode() { return mode; },
    get target() { return target; }, get camX() { return camX; }, get camY() { return camY; },
    get warp() { return warp; }, get veil() { return veil; }, get occlude() { return occlude; },
    set paused(v) { paused = !!v; },
    get baseR() { return baseR(); },
    tex(qi, pass) { return discTex(qi, pass).toDataURL(); },
  };
})();
</script>
